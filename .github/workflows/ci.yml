name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend Tests & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Generate Prisma client
        run: npx prisma generate --schema prisma/schema.prisma
        working-directory: backend
        env:
          DATABASE_URL: "file:./dev.db"

      # Use migrate deploy (not db push) so raw SQL migrations such as
      # notif_broadcast_dedup partial unique index are applied.
      - name: Apply database migrations
        run: npx prisma migrate deploy --schema prisma/schema.prisma
        working-directory: backend
        env:
          DATABASE_URL: "file:./dev.db"

      - name: Run type check
        run: npm run lint
        working-directory: backend

      - name: Run unit tests
        run: npm test
        working-directory: backend
        env:
          DATABASE_URL: "file:./dev.db"

      - name: Build application
        run: npm run build
        working-directory: backend

  frontend:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run type check
        run: npm run type-check
        working-directory: frontend

      - name: Run linting
        run: npm run lint
        working-directory: frontend

      - name: Build application
        run: npm run build
        working-directory: frontend

      # Playwright E2E requires a running frontend (:3000) and backend (:4000).
      # playwright.config.ts sets webServer: undefined, so CI cannot auto-start
      # that stack. Keep E2E local/manual until a dedicated E2E job provisions services.

  postgres-verification:
    name: PostgreSQL Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: frontdesk_ci
          POSTGRES_PASSWORD: ci_password_test_only
          POSTGRES_DB: frontdesk_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U frontdesk_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Generate Prisma client (PostgreSQL)
        run: npx prisma generate --schema prisma/schema.pg.prisma
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://frontdesk_ci:ci_password_test_only@localhost:5432/frontdesk_ci"

      - name: Enable pgvector extension
        run: |
          PGPASSWORD=ci_password_test_only psql -h localhost -U frontdesk_ci -d frontdesk_ci -c \
            "CREATE EXTENSION IF NOT EXISTS vector;"
        working-directory: backend

      - name: Push PostgreSQL schema
        run: npx prisma db push --schema prisma/schema.pg.prisma --skip-generate
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://frontdesk_ci:ci_password_test_only@localhost:5432/frontdesk_ci"

      - name: Verify media_type column exists
        run: |
          PGPASSWORD=ci_password_test_only psql -h localhost -U frontdesk_ci -d frontdesk_ci -c \
            "SELECT column_name FROM information_schema.columns WHERE table_name='media_assets' AND column_name='media_type';"
        working-directory: backend

      - name: Run PostgreSQL media tests
        run: npx vitest run tests/media-pg.test.ts
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://frontdesk_ci:ci_password_test_only@localhost:5432/frontdesk_ci"
          NODE_ENV: "test"

  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [backend, frontend, postgres-verification]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # GHCR requires lowercase repository names; github.repository preserves
      # the owner/repo casing as written on GitHub.
      - name: Compute lowercase image repository
        run: echo "IMAGE_REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_REPO }}-backend
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ env.IMAGE_REPO }}-backend:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.IMAGE_REPO }}-backend:buildcache,mode=max

      - name: Extract metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_REPO }}-frontend
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ env.IMAGE_REPO }}-frontend:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.IMAGE_REPO }}-frontend:buildcache,mode=max
